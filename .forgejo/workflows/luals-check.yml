name: LuaLS Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  luals:
    runs-on: codeberg-tiny

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install dependencies
        run: |
          apt update
          apt install -y curl jq

      - name: Download Lua Language Server
        id: luals-version
        run: |
          LATEST=$(curl -s -H "Accept: application/vnd.github+json" https://api.github.com/repos/LuaLS/lua-language-server/releases/latest)
          VERSION=$(echo "$LATEST" | jq -r '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Lua Language Server
        uses: actions/cache@v4
        id: cache-luals
        with:
          path: /opt/lua-language-server
          key: luals-${{ steps.luals-version.outputs.version }}

      - name: Download Lua Language Server
        if: steps.cache-luals.outputs.cache-hit != 'true'
        run: |
          LATEST=$(curl -s -H "Accept: application/vnd.github+json" https://api.github.com/repos/LuaLS/lua-language-server/releases/latest)
          DOWNLOAD_URL=$(echo "$LATEST" | jq -r '.assets[] | select(.name | contains("linux-x64")) | .browser_download_url')
          curl -L -o /tmp/lua-language-server.tar.gz "$DOWNLOAD_URL"
          mkdir -p /opt/lua-language-server
          tar -xzf /tmp/lua-language-server.tar.gz -C /opt/lua-language-server

      - name: Setup LuaLS symlink
        run: |
          ln -sf /opt/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server
          lua-language-server --version

      - name: Run LuaLS diagnostics
        run: |
          # Ensure .luarc.json exists (should be committed)
          if [ ! -f .luarc.json ]; then
            echo "Error: .luarc.json not found. Please generate it from .vscode/settings.json."
            exit 1
          fi
          # Run diagnostics with JSON output
          lua-language-server --check . --checklevel=Warning --check_format=json --check_out_path=/tmp/diagnostics.json || true
          if [ -f /tmp/diagnostics.json ]; then
            # Count total diagnostics across all files
            TOTAL=$(jq '[.[] | length] | add' /tmp/diagnostics.json)
            if [ "$TOTAL" -gt 0 ]; then
              echo "Found $TOTAL diagnostic(s) across $(jq 'length' /tmp/diagnostics.json) file(s)"
              # Print a summary (first 15 diagnostics)
              echo "Summary (first 15):"
              jq -r '[to_entries[] | .key as $file | .value[] | "\($file): \(.message)"] | .[:15][]' /tmp/diagnostics.json
              exit 1
            else
              echo "No diagnostics found"
            fi
          else
            echo "No diagnostics file generated"
            exit 1
          fi
